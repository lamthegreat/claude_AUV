name: ROS 2 CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ros2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROS_DISTRO: jazzy
  ROS_WS: ${{ github.workspace }}/ros2_ws
  CAPTURE_SIM_BAG_ON_FAILURE: true

jobs:
  build_unit:
    name: Build + Unit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ROS 2 and build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl gnupg lsb-release software-properties-common
          curl -fsSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/ros2-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros2-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo "${UBUNTU_CODENAME}") main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y \
            ros-${ROS_DISTRO}-ros-base \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-vcstool \
            python3-argcomplete
          sudo rosdep init || true
          rosdep update

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -euxo pipefail
          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          set -u
          rosdep install --from-paths "${ROS_WS}/src" --ignore-src --rosdistro "${ROS_DISTRO}" -y

      - name: Build workspace
        shell: bash
        run: |
          set -euxo pipefail
          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          set -u
          cd "${ROS_WS}"
          colcon build --symlink-install --event-handlers console_cohesion+

      - name: Run tests
        shell: bash
        run: |
          set -euxo pipefail
          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          set -u
          cd "${ROS_WS}"
          set +u
          source install/setup.bash
          set -u
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose

      - name: Upload build and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-unit-artifacts
          if-no-files-found: warn
          path: |
            ros2_ws/log
            ros2_ws/build

  sim_smoke:
    name: Sim Smoke
    runs-on: ubuntu-24.04
    needs: build_unit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ROS 2 and build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl gnupg lsb-release software-properties-common
          curl -fsSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/ros2-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros2-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo "${UBUNTU_CODENAME}") main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y \
            ros-${ROS_DISTRO}-ros-base \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-vcstool \
            python3-argcomplete \
            ros-${ROS_DISTRO}-ros2bag \
            ros-${ROS_DISTRO}-rosbag2-storage-default-plugins
          sudo rosdep init || true
          rosdep update

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -euxo pipefail
          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          set -u
          rosdep install --from-paths "${ROS_WS}/src" --ignore-src --rosdistro "${ROS_DISTRO}" -y

      - name: Build packages needed for smoke test
        shell: bash
        run: |
          set -euxo pipefail
          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          set -u
          cd "${ROS_WS}"
          colcon build --symlink-install --packages-up-to auv_sim --event-handlers console_cohesion+

      - name: Run allocator smoke launch
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${GITHUB_WORKSPACE}/ci_artifacts/sim"
          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          set -u
          cd "${ROS_WS}"
          set +u
          source install/setup.bash
          set -u
          ros2 launch auv_sim allocator_smoke.launch.py \
            2>&1 | tee "${GITHUB_WORKSPACE}/ci_artifacts/sim/allocator_smoke.log"

      - name: Capture rosbag after smoke failure
        if: steps.smoke.outcome == 'failure' && env.CAPTURE_SIM_BAG_ON_FAILURE == 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${GITHUB_WORKSPACE}/ci_artifacts/sim/bag"
          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          set -u
          cd "${ROS_WS}"
          set +u
          source install/setup.bash
          set -u
          ros2 launch auv_sim allocator_smoke.launch.py \
            record_bag:=true \
            bag_output_dir:="${GITHUB_WORKSPACE}/ci_artifacts/sim/bag/allocator_smoke_failure_bag" \
            2>&1 | tee "${GITHUB_WORKSPACE}/ci_artifacts/sim/allocator_smoke_failure_rerun.log" || true

      - name: Upload sim artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-smoke-artifacts
          if-no-files-found: warn
          path: |
            ros2_ws/log
            ci_artifacts/sim

      - name: Fail job if smoke test failed
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          echo "Allocator smoke launch failed."
          exit 1
